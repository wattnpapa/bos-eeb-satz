# Prüflauf des geteilten Kerns. Die vier Schritte sind genau die, mit denen
# ADR-003 seine Aufnahmeregeln maschinell hinterlegt:
#
#   lint       — keine node:-, DOM-, React- oder Rückimporte (Regel 2 und 3)
#   typecheck  — zwei Programme: das plattformneutrale ohne DOM- und
#                Node-Typen, und getrennt davon die Node-Implementierung
#   test       — dieselben Testdateien unter node UND jsdom (Regel 2)
#   build      — belegt, dass dist/ samt Typdeklarationen entsteht; ohne das
#                bekommt ein Konsument beim npm install ein leeres Paket

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # Die vier Kern-Bausteine liegen als Nachbarordner daneben
      # (devDependencies `file:../…`), gebaut in der Reihenfolge aus dem README
      # von eeb-format. Gepinnt auf den Stand, den beide Apps einbinden; kein
      # automatisches Folgen von `main` (Regel 6).
      - uses: actions/checkout@v4
        with:
          path: bos-eeb-satz
      - uses: actions/checkout@v4
        with:
          repository: wattnpapa/eeb-format
          ref: eb58ad69ba54f2c3497e08bcc87773efb0adf890
          path: eeb-format
      - uses: actions/checkout@v4
        with:
          repository: wattnpapa/bos-vokabulare
          ref: 2f94a4699a4b8c17eac7f8c398e3279df3a1a0d7
          path: bos-vokabulare
      - uses: actions/checkout@v4
        with:
          repository: wattnpapa/bos-taktische-zeichen
          ref: cb9c227612c87018f81dccc7efa03f00d0584653
          path: bos-taktische-zeichen
      - uses: actions/checkout@v4
        with:
          repository: wattnpapa/bos-meldekopf
          ref: 59a986c5296dbbfb4f2a725a6674965ef64d603c
          path: bos-meldekopf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: eeb-format bauen
        working-directory: eeb-format
        run: npm ci && npm run build
      - name: bos-vokabulare bauen
        working-directory: bos-vokabulare
        run: npm ci && npm run build
      - name: bos-taktische-zeichen bauen
        working-directory: bos-taktische-zeichen
        run: npm ci && npm run build
      - name: bos-meldekopf bauen
        working-directory: bos-meldekopf
        run: npm ci && npm run build
      - run: npm ci
        working-directory: bos-eeb-satz
      - run: npm run lint
        working-directory: bos-eeb-satz
      - run: npm run typecheck
        working-directory: bos-eeb-satz
      - run: npm test
        working-directory: bos-eeb-satz
      - run: npm run build
        working-directory: bos-eeb-satz
